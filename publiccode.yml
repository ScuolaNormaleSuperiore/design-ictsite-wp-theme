description:
  it:
    documentation: >-
      https://github.com/ScuolaNormaleSuperiore/design-ictsite-wp-theme/blob/main/DOC/Sito_ICT_Manuale_operatore.pdf
    features:
      - Popolamento automatico del sito (pagine e menu).
      - Sezione per la configurazione di temi e contenuti.
      - Personalizzazione del layout della home page.
      - Gestione del personale ICT.
      - Gestione dei progetti ICT.
      - Gestione di news ed eventi.
      - Gestione delle sedi del sito.
      - Gestione delle FAQ e dei documenti ICT.
      - Gestione degli articoli del blog.
      - Pagine di archivio con impaginazione.
      - Ricerca in tutti i contenuti del sito.
      - Gestione degli avvisi del sito.
      - Gestione dei cookie.
      - Mappa del sito.
      - Gestione della sezione Hero in home page.
      - Gestione di eventi, news e sezioni articoli in home page.
      - Gestione dei banner in home page.
      - Supporto multilingua.
      - PWA installabile con service worker e pagina offline.
    localisedName: Design ICT Site
    longDescription: |
      Design ICT Site è un tema WordPress per costruire il sito dei servizi ICT di un ente: pubblica in modo ordinato servizi e cluster di servizi, uffici, persone, progetti, luoghi, eventi, notizie, FAQ e documentazione, oltre agli articoli del blog.

      Dopo l'attivazione il tema popola il sito con pagine e menu predefiniti e offre un'area di configurazione per identità del sito, contatti, avvisi, newsletter e analytics. La home page è modulare: hero, cluster di servizi, eventi, notizie, progetti, contenuti in evidenza, articoli, banner, sponsor e video si attivano e si ordinano dal pannello.

      Il tema usa Bootstrap Italia, segue le Linee guida di design per i servizi digitali della PA, è multilingue grazie a Polylang e include ricerca su tutti i contenuti con suggerimenti opzionali, mappa del sito HTML e XML, esportazione in JSON di FAQ e servizi e supporto PWA. È disponibile una demo con Docker.
    screenshots:
      - assets/screenshots/homepage.png
      - assets/screenshots/hp-service-cluster.png
      - assets/screenshots/service-cluster.png
      - assets/screenshots/service-item.png
      - assets/screenshots/faq.png
      - assets/screenshots/documentation.png
      - assets/screenshots/backoffice.png
    shortDescription: >-
        Tema WordPress per la creazione di siti web che presentano e facilitano l'utilizzo dei servizi ICT di un'organizzazione.
