# Dependabot version updates.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Bundled third-party libraries under inc/vendor/ and assets/ are vendored by hand and are
# intentionally not listed here.
version: 2

updates:
  # Build and scan tooling (package.json / package-lock.json).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # PHP tooling (composer.json).
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      composer-dependencies:
        patterns:
          - "*"

  # Actions used in .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Base image of the Docker demo environment.
  - package-ecosystem: "docker"
    directory: "/SETUP/Docker"
    schedule:
      interval: "weekly"
